version: '3.8'

services:
  # Python Processing Service
  python-service:
    build:
      context: ./python-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - STORAGE_PATH=/app/storage
      - UPLOAD_PATH=/app/uploads
    volumes:
      - python-storage:/app/storage
      - python-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - webtoon-network

  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:h2:file:/app/data/webtoon-tracker
      - PYTHON_SERVICE_URL=http://python-service:8001
    volumes:
      - backend-data:/app/data
      - backend-uploads:/app/uploads
    depends_on:
      - python-service
    networks:
      - webtoon-network

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - backend
    networks:
      - webtoon-network

volumes:
  python-storage:
  python-uploads:
  backend-data:
  backend-uploads:

networks:
  webtoon-network:
    driver: bridge
